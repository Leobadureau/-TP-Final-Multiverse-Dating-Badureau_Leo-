<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinder Multiverse Rick & Morty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <img src="Rick-And-Morty-PNG-Image-180x180.png" alt="logo" id="image">
    <img src="R.svg" alt="logo">
  </header>

  <!-- CONTAINER PRINCIPAL -->
  <div id="container">

    <!-- FILTRES (GAUCHE) -->
     
    <div id="filters">
        <button id="toggle-darkmode">🌙 Mode</button>
      <h2>Filtres</h2>
      <form id="searchForm">
        <input type="text" id="nameInput" placeholder="Nom du perso">
        <select id="statusSelect">
          <option value="">Statut</option>
          <option value="alive">Alive</option>
          <option value="dead">Dead</option>
          <option value="unknown">Unknown</option>
        </select>
        <select id="speciesSelect">
          <option value="">Espèce</option>
          <option value="Human">Human</option>
          <option value="Alien">Alien</option>
          <option value="Robot">Robot</option>
          <option value="unknown">Unknown</option>
        </select>
        <button type="submit">Filtrer 🔎</button>
      </form>

      <!-- COMPTEURS LIKE / PASS -->
      <div id="counters-container" >
        <span >Like ❤️ : <span id="like-counter">0</span></span>
        <span >Pass ❌ : <span id="pass-counter">0</span></span>
      </div>
    </div>

    <!-- DECK + PORTAIL (CENTRE) -->
    <div id="deck-wrapper">
      <div id="portal"></div>
      <div id="deck">
        <!-- Cartes injectées par JS -->
      </div>
    </div>

    <!-- MATCH LIST (DROITE) -->
    <div id="match-list">
      <h2>Mes Crushs</h2>
      <div id="matches">
        <p>Aucun crush pour le moment 💔</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
